<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🐸</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            font-family: Georgia, serif;

            background: #f28c28;

            display: flex;

            justify-content: center;

            align-items: center;

            overflow: hidden;
        }


        /* =========================
           PANTALLA DE CONTRASEÑA
           ========================= */

        #passwordScreen {

            text-align: center;

            transition: opacity 1.5s ease;

            padding: 20px;
        }


        .rana {

            font-size: 80px;

            margin-bottom: 20px;

        }


        .frase {

            color: #ffffff;

            font-size: 18px;

            margin-bottom: 25px;

            max-width: 400px;

        }


        input {

            width: 260px;

            padding: 14px;

            border: 2px solid #ffffff;

            border-radius: 25px;

            text-align: center;

            font-size: 16px;

            outline: none;

        }


        input:focus {

            border-color: #333333;

        }


        button {

            display: block;

            margin: 20px auto;

            padding: 13px 30px;

            border: none;

            border-radius: 25px;

            background: #ffffff;

            color: #e67e22;

            font-size: 16px;

            cursor: pointer;

            transition: 0.3s;

        }


        button:hover {

            transform: scale(1.08);

        }


        #error {

            color: #ffffff;

            font-size: 15px;

            margin-top: 10px;

            line-height: 1.6;

        }


        /* =========================
           PANTALLA DEL VIDEO
           ========================= */

        #videoScreen {

            position: absolute;

            width: 100%;

            height: 100%;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            background: #000;

            opacity: 0;

            visibility: hidden;

            transition: opacity 2s ease;

            padding: 20px;
        }


        #videoScreen video {

            width: 90%;

            max-width: 1000px;

            max-height: 75vh;

            border-radius: 15px;

            box-shadow: 0 0 40px rgba(255,255,255,0.2);

        }


        /* =========================
           BOTÓN ABRIR
           ========================= */

        .boton-carta {

            margin-top: 25px;

            padding: 13px 30px;

            background: #e53935;

            color: white;

            text-decoration: none;

            border-radius: 25px;

            font-size: 16px;

            transition: 0.3s;

        }


        .boton-carta:hover {

            background: #b71c1c;

            transform: scale(1.08);

        }


        /* =========================
           CELULAR
           ========================= */

        @media (max-width: 600px) {

            input {

                width: 220px;

            }


            .frase {

                font-size: 16px;

            }


            #videoScreen video {

                width: 100%;

                max-height: 70vh;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         PANTALLA DE CONTRASEÑA
         ========================= -->

    <div id="passwordScreen">

        <div class="rana">
            🐸
        </div>


        <div class="frase">
            I wanna love like you made me feel when we were...
        </div>


        <input
            type="password"
            id="password"
            placeholder="Contraseña"
        >


        <button onclick="entrar()">
            Entrar
        </button>


        <p id="error"></p>

    </div>



    <!-- =========================
         PANTALLA DEL VIDEO
         ========================= -->

    <div id="videoScreen">

        <video id="video" controls>

            <source
                src="video.mp4"
                type="video/mp4"
            >

            Tu navegador no puede reproducir este video.

        </video>


        <a
            href="carta.html"
            class="boton-carta"
        >
            ABRIR
        </a>

    </div>



    <!-- =========================
         JAVASCRIPT
         ========================= -->

    <script>

        function entrar() {

            const password =
                document.getElementById("password").value;


            const passwordCorrecta = "18";


            if (password === passwordCorrecta) {

                const pantalla =
                    document.getElementById("passwordScreen");


                const videoScreen =
                    document.getElementById("videoScreen");


                const video =
                    document.getElementById("video");


                pantalla.style.opacity = "0";


                setTimeout(function() {

                    pantalla.style.display = "none";


                    videoScreen.style.visibility =
                        "visible";


                    videoScreen.style.opacity =
                        "1";


                    video.play();


                }, 1500);


            } else {

                document.getElementById("error").innerHTML =
                    "Contraseña equivocada<br>" +
                    "PISTA: Intenta con números";

            }

        }

    </script>


</body>

</html>
