<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>🐸</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            font-family: Georgia, serif;

            background: #f28c28;

            display: flex;

            justify-content: center;

            align-items: center;

            overflow: hidden;
        }


        /* =========================
           PANTALLA DE CONTRASEÑA
           ========================= */

        #passwordScreen {

            text-align: center;

            transition: opacity 1.5s ease;

            padding: 20px;
        }


        .rana {

            font-size: 80px;

            margin-bottom: 20px;
        }


        .frase {

            color: white;

            font-size: 18px;

            margin-bottom: 25px;

            max-width: 400px;
        }


        input {

            width: 260px;

            padding: 14px;

            border: 2px solid white;

            border-radius: 25px;

            text-align: center;

            font-size: 16px;

            outline: none;
        }


        input:focus {

            border-color: #333;
        }


        button {

            display: block;

            margin: 20px auto;

            padding: 13px 30px;

            border: none;

            border-radius: 25px;

            background: white;

            color: #e67e22;

            font-size: 16px;

            cursor: pointer;

            transition: 0.3s;
        }


        button:hover {

            transform: scale(1.08);
        }


        #error {

            color: white;

            font-size: 15px;

            margin-top: 10px;

            line-height: 1.6;
        }


        /* =========================
           PANTALLA DEL VIDEO
           ========================= */

        #videoScreen {

            position: absolute;

            width: 100%;

            height: 100%;

            display: flex;

            justify-content: center;

            align-items: center;

            background: black;

            opacity: 0;

            visibility: hidden;

            transition: opacity 2s ease;

            padding: 20px;
        }


        /* =========================
           CONTENEDOR
           ========================= */

        .video-container {

            position: relative;

            display: inline-block;

            overflow: visible;

            text-align: center;
        }


        /* =========================
           VIDEO
           ========================= */

        #video {

            width: 90vw;

            max-width: 1000px;

            max-height: 75vh;

            border-radius: 15px;

            box-shadow:
                0 0 40px
                rgba(255,255,255,0.2);

            display: block;
        }


        /* =========================
           BOTÓN ABRIR
           ========================= */

        .boton-carta {

            position: absolute;

            left: 50%;

            top: 100%;

            transform:
                translateX(-50%)
                translateY(-18px);

            padding: 13px 35px;

            background: #e53935;

            color: white;

            text-decoration: none;

            border-radius: 25px;

            font-size: 16px;

            white-space: nowrap;

            opacity: 0.85;

            transition:
                transform 0.8s ease,
                opacity 0.8s ease;

            z-index: 5;
        }


        /* =========================
           CUANDO TERMINA EL VIDEO
           ========================= */

        .boton-carta.mostrar {

            transform:
                translateX(-50%)
                translateY(15px);

            opacity: 1;
        }


        /* =========================
           HOVER
           ========================= */

        .boton-carta:hover {

            background: #b71c1c;

            transform:
                translateX(-50%)
                translateY(10px)
                scale(1.08);
        }


        /* =========================
           CELULAR
           ========================= */

        @media (max-width: 600px) {

            #video {

                width: 100%;

                max-height: 70vh;
            }


            .boton-carta {

                padding: 12px 30px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         CONTRASEÑA
         ========================= -->

    <div id="passwordScreen">

        <div class="rana">
            🐸
        </div>


        <div class="frase">
            I wanna love like you made me feel when were...
        </div>


        <input
            type="password"
            id="password"
            placeholder="Contraseña"
        >


        <button onclick="entrar()">
            Entrar
        </button>


        <p id="error"></p>

    </div>



    <!-- =========================
         VIDEO
         ========================= -->

    <div id="videoScreen">


        <div class="video-container">


            <video id="video" controls>

                <source
                    src="video.mp4"
                    type="video/mp4"
                >

                Tu navegador no puede reproducir este video.

            </video>


            <a
                href="carta.html"
                class="boton-carta"
                id="botonCarta"
            >
                ABRIR
            </a>


        </div>

    </div>



    <!-- =========================
         JAVASCRIPT
         ========================= -->

    <script>

        function entrar() {

            const password =
                document.getElementById("password").value;


            const passwordCorrecta = "18";


            if (password === passwordCorrecta) {

                const pantalla =
                    document.getElementById("passwordScreen");


                const videoScreen =
                    document.getElementById("videoScreen");


                const video =
                    document.getElementById("video");


                pantalla.style.opacity = "0";


                setTimeout(function() {

                    pantalla.style.display = "none";

                    videoScreen.style.visibility =
                        "visible";

                    videoScreen.style.opacity =
                        "1";

                    video.play();

                }, 1500);

            }


            else {

                document.getElementById("error").innerHTML =
                    "Contraseña equivocada<br>" +
                    "PISTA: Intenta con números";

            }

        }


        /* =========================
           DETECTAR FIN DEL VIDEO
           ========================= */

        const video =
            document.getElementById("video");


        const boton =
            document.getElementById("botonCarta");


        video.addEventListener("ended", function() {

            boton.classList.add("mostrar");

        });

    </script>


</body>

</html>
